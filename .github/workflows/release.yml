# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: release
on:
  push:
    branches:
      - main
permissions:
  contents: read
jobs:
  release-pr-ci:
    needs: release
    if: ${{ needs.release.outputs.pr_branch != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.release.outputs.pr_branch }}
        run: |
          for _ in 1 2 3 4 5 6; do
            ids=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=$BRANCH&event=pull_request&status=action_required" --jq '.workflow_runs[].id')
            [ -n "$ids" ] && break
            sleep 10
          done
          if [ -z "$ids" ]; then echo "::notice::no held runs for $BRANCH"; fi
          for id in $ids; do gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$id/approve"; done
  release:
    uses: vannt-dev/repokeeper/.github/workflows/release-please.yml@v0
    permissions:
      contents: write
      pull-requests: write
      issues: write
    secrets:
      token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
  # Added by hand (repokeeper leaves it alone): publishes the release to npm through trusted publishing
  # (npmjs.com trusts this repository and this workflow; no token secret).
  publish:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm publish --provenance --access public
  # Added by hand: moves the major tag (v0, v1) that `uses: vannt-dev/mv3-remote-code-check@v0`
  # in other repositories' workflows points at.
  major-tag:
    needs: release
    if: ${{ needs.release.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # true on purpose (zizmor artipacked): the next step pushes the tag with these credentials.
          persist-credentials: true
      - name: Move the major tag to this release
        env:
          TAG: ${{ needs.release.outputs.tag_name }}
          MAJOR: ${{ needs.release.outputs.major }}
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          git tag -f "v$MAJOR" "$TAG"
          git push -f origin "refs/tags/v$MAJOR"
