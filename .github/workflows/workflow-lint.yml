# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`. Keys and jobs you add yourself are left alone.

name: workflow lint
on:
  pull_request:
    paths:
      - .github/**
      - "**/action.yml"
      - "**/action.yaml"
  push:
    branches:
      - main
    paths:
      - .github/**
      - "**/action.yml"
      - "**/action.yaml"
  schedule:
    - cron: 17 5 * * 1
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    uses: vannt-dev/repokeeper/.github/workflows/workflow-lint.yml@v0
    permissions:
      contents: read
