# Managed by repokeeper (https://github.com/vannt-dev/repokeeper). Edits are reported by `repokeeper check`.
pre-commit:
  parallel: true
  jobs:
    - name: node:prettier
      glob: "*.{js,jsx,ts,tsx,mjs,cjs,json,css,scss,md,yml,yaml,html}"
      run: npx prettier --write --ignore-unknown {staged_files}
      stage_fixed: true
    - name: node:eslint
      glob: "*.{js,jsx,ts,tsx,mjs,cjs}"
      run: npx eslint --fix {staged_files}
      stage_fixed: true
commit-msg:
  jobs:
    - name: commitlint
      run: npx --no-install commitlint --edit {1}
pre-push:
  jobs:
    - name: node:test
      run: npm test
